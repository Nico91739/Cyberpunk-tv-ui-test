<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIGHT CITY // TV HUB</title>
<style>
:root{
  --bg:#000;
  --cyan:#00f0ff;
  --cyan-dim:#0a5a63;
  --yellow:#fcee0a;
  --red:#ff2a55;
  --panel:#05090b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);cursor:none}
body{
  font-family:"Orbitron","Rajdhani","Eurostile","Bank Gothic","Segoe UI",Arial,sans-serif;
  color:var(--cyan);
  text-transform:uppercase;
  background:
    repeating-linear-gradient(0deg,rgba(0,240,255,.035) 0 1px,transparent 1px 4px),
    linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px) 0 0/6vw 6vw,
    linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px) 0 0/6vw 6vw,
    radial-gradient(ellipse at 50% 120%,rgba(252,238,10,.08),transparent 60%),
    #000;
}
.screen{position:relative;width:100vw;height:100vh;padding:3.5vh 4vw;display:flex;flex-direction:column}

/* HUD TOP */
.hud{display:flex;justify-content:space-between;align-items:stretch;gap:3vw;
  border-bottom:2px solid var(--cyan-dim);padding-bottom:2.2vh;position:relative}
.hud::after{content:"";position:absolute;left:0;bottom:-2px;width:18vw;height:2px;background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.brand{display:flex;flex-direction:column;justify-content:center}
.brand b{font-size:2.6vh;letter-spacing:.5em;color:var(--yellow)}
.brand span{font-size:1.7vh;letter-spacing:.3em;opacity:.7;margin-top:.6vh}
.clockbox{text-align:center}
#clock{font-size:8.5vh;font-weight:700;letter-spacing:.08em;color:var(--cyan);
  text-shadow:0 0 10px rgba(0,240,255,.7),0 0 24px rgba(0,240,255,.35);
  font-variant-numeric:tabular-nums;line-height:1}
#date{font-size:1.9vh;letter-spacing:.35em;color:var(--yellow);margin-top:1vh}
.stats{display:grid;grid-template-columns:repeat(2,auto);gap:.8vh 1.6vw;align-content:center;font-size:1.8vh;letter-spacing:.15em}
.stat{display:flex;align-items:center;gap:.7vw;white-space:nowrap}
.dot{width:1.1vh;height:1.1vh;background:var(--cyan);box-shadow:0 0 6px var(--cyan);animation:blink 1.6s steps(2) infinite}
.stat.warn .dot{background:var(--yellow);box-shadow:0 0 6px var(--yellow);animation-duration:.9s}
.stat em{font-style:normal;color:var(--yellow)}
@keyframes blink{50%{opacity:.25}}

/* GRID */
.main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:4vh;padding:2vh 2vw}
.row{display:flex;justify-content:center;gap:3vw}
.app{
  position:relative;width:24vw;height:27vh;background:var(--panel);
  border:2px solid var(--cyan-dim);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh;
  color:var(--cyan);opacity:.82;
  transition:transform .12s ease-out,box-shadow .12s ease-out,border-color .12s,opacity .12s;
  will-change:transform;
}
.app::before,.app::after{content:"";position:absolute;width:2.2vh;height:2.2vh;border:3px solid var(--yellow);opacity:0;transition:opacity .12s}
.app::before{top:-3px;left:-3px;border-right:0;border-bottom:0}
.app::after{bottom:-3px;right:-3px;border-left:0;border-top:0}
.tag{position:absolute;top:1.2vh;left:1.2vw;font-size:1.5vh;letter-spacing:.2em;opacity:.55}
.ico{font-size:8vh;line-height:1;font-weight:900}
.name{font-size:3.4vh;font-weight:700;letter-spacing:.22em}
.app.sel{
  transform:scale(1.07);opacity:1;border-color:var(--yellow);color:var(--yellow);
  box-shadow:0 0 18px rgba(252,238,10,.65),0 0 48px rgba(252,238,10,.28),inset 0 0 22px rgba(252,238,10,.18);
}
.app.sel::before,.app.sel::after{opacity:1}
.app.sel .ico,.app.sel .name{text-shadow:0 0 12px rgba(252,238,10,.85)}
.app.sel .tag{opacity:1}
.app.go{animation:go .35s steps(4)}
@keyframes go{25%{background:var(--yellow);color:#000}50%{background:var(--panel)}75%{background:var(--cyan);color:#000}}

/* FOOTER */
.foot{display:flex;justify-content:space-between;font-size:1.6vh;letter-spacing:.25em;opacity:.75;
  border-top:2px solid var(--cyan-dim);padding-top:1.6vh}
.foot b{color:var(--yellow);font-weight:700}
</style>
</head>
<body>
<div class="screen">

  <header class="hud">
    <div class="brand"><b>NIGHT CITY</b><span>// TV HUB v2.077</span></div>
    <div class="clockbox"><div id="clock">00:00:00</div><div id="date">--</div></div>
    <div class="stats">
      <div class="stat"><i class="dot"></i>SYSTEM: <em>ONLINE</em></div>
      <div class="stat"><i class="dot"></i>NET: <em>CONNECTED</em></div>
      <div class="stat"><i class="dot"></i>PING: <em id="ping">12</em> MS</div>
      <div class="stat warn"><i class="dot"></i>NEURAL LINK: <em>ACTIVE</em></div>
      <div class="stat"><i class="dot"></i>CPU: <em id="cpu">24</em>%</div>
      <div class="stat"><i class="dot"></i>ICE: <em>SECURE</em></div>
    </div>
  </header>

  <main class="main" id="grid">
    <div class="row">
      <a class="app" data-url="https://www.netflix.com"><span class="tag">APP_01</span><span class="ico">N</span><span class="name">Netflix</span></a>
      <a class="app" data-url="https://www.youtube.com/tv"><span class="tag">APP_02</span><span class="ico">&#9654;</span><span class="name">YouTube</span></a>
      <a class="app" data-url="https://www.primevideo.com"><span class="tag">APP_03</span><span class="ico">P</span><span class="name">Prime Video</span></a>
    </div>
    <div class="row">
      <a class="app" data-url="https://app.plex.tv"><span class="tag">APP_04</span><span class="ico">&#10095;</span><span class="name">Plex</span></a>
      <a class="app" data-url="https://www.google.com"><span class="tag">APP_05</span><span class="ico">&#9678;</span><span class="name">Browser Web</span></a>
    </div>
  </main>

  <footer class="foot">
    <span><b>&#9664; &#9650; &#9660; &#9654;</b> NAVIGA</span>
    <span id="sel">// SELECT: NETFLIX</span>
    <span><b>OK</b> AVVIA</span>
  </footer>
</div>

<script>
(function(){
  var rows=[].map.call(document.querySelectorAll('.row'),function(r){return [].slice.call(r.children);});
  var r=0,c=0,cur=null,selEl=document.getElementById('sel');

  function select(nr,nc){
    r=nr;c=Math.min(nc,rows[r].length-1);
    if(cur)cur.classList.remove('sel');
    cur=rows[r][c];cur.classList.add('sel');
    selEl.textContent='// SELECT: '+cur.querySelector('.name').textContent;
  }
  function launch(){
    if(!cur)return;
    cur.classList.add('go');
    var u=cur.getAttribute('data-url');
    setTimeout(function(){cur.classList.remove('go');window.location.href=u;},350);
  }

  document.addEventListener('keydown',function(e){
    var k=e.keyCode;
    if(k===37){if(c>0)select(r,c-1);}
    else if(k===39){if(c<rows[r].length-1)select(r,c+1);}
    else if(k===38){if(r>0)select(r-1,c);}
    else if(k===40){if(r<rows.length-1)select(r+1,c);}
    else if(k===13){launch();}
    else return;
    e.preventDefault();
  });

  rows.forEach(function(row,ri){row.forEach(function(el,ci){
    el.addEventListener('click',function(){select(ri,ci);launch();});
  });});

  /* Clock */
  var clk=document.getElementById('clock'),dt=document.getElementById('date');
  var days=['DOM','LUN','MAR','MER','GIO','VEN','SAB'];
  function p(n){return n<10?'0'+n:n;}
  function tick(){
    var d=new Date();
    clk.textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
    dt.textContent=days[d.getDay()]+' '+p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear();
  }
  tick();setInterval(tick,1000);

  /* Fake system stats */
  var ping=document.getElementById('ping'),cpu=document.getElementById('cpu');
  setInterval(function(){
    ping.textContent=8+Math.floor(Math.random()*20);
    cpu.textContent=15+Math.floor(Math.random()*35);
  },3000);

  select(0,0);
})();
</script>
</body>
</html>
